<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ürün Detayı — markabahçem.com</title>
<link rel="stylesheet" href="trendyol-style.css" />
<link rel="stylesheet" href="style.css" />
<style>
  .pd-wrap { max-width: 1200px; margin: 0 auto; padding: 20px 32px 60px; }
  .pd-breadcrumb { font-size: 12px; color: var(--ty-gray); margin-bottom: 16px; }
  .pd-breadcrumb a { color: var(--ty-gray); }
  .pd-breadcrumb a:hover { color: var(--ty-orange); }

  .pd-main {
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 40px;
    background: white;
    border: 1px solid var(--ty-border);
    border-radius: 10px;
    padding: 32px;
  }
  .pd-gallery { display: flex; flex-direction: column; gap: 12px; }
  .pd-image-main {
    aspect-ratio: 1;
    background: #fafafa;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 140px;
    position: relative;
    overflow: hidden;
  }
  .pd-image-main img, .pd-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pd-thumbs { display: flex; gap: 8px; }
  .pd-thumb {
    width: 64px; height: 64px;
    background: #fafafa;
    border: 2px solid var(--ty-border);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    cursor: pointer;
    overflow: hidden;
  }
  .pd-thumb.active { border-color: var(--ty-orange); }

  .pd-info { display: flex; flex-direction: column; gap: 10px; }
  .pd-store-link { font-size: 13px; font-weight: 800; color: var(--ty-orange); }
  .pd-title { font-size: 20px; font-weight: 700; margin: 0; line-height: 1.4; }
  .pd-rating-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ty-gray); }
  .pd-rating-row .ty-stars { font-size: 15px; }

  .pd-price-block { margin: 10px 0; padding: 16px 0; border-top: 1px solid var(--ty-border); border-bottom: 1px solid var(--ty-border); }
  .pd-price-old { font-size: 14px; color: var(--ty-gray); text-decoration: line-through; }
  .pd-price-new { font-size: 30px; font-weight: 800; color: var(--ty-dark); display: block; margin-top: 4px; }
  .pd-discount-tag { display: inline-block; background: var(--ty-red); color: white; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }

  .pd-delivery-box { background: var(--ty-orange-light); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--ty-orange-dark); display: flex; flex-direction: column; gap: 4px; }

  .pd-qty-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
  .pd-qty-selector { display: flex; align-items: center; border: 1.5px solid var(--ty-border); border-radius: 6px; overflow: hidden; }
  .pd-qty-selector button { background: #f7f7f7; border: none; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  .pd-qty-selector span { width: 40px; text-align: center; font-weight: 700; font-size: 14px; }

  .pd-actions { display: flex; gap: 10px; margin-top: 8px; }
  .pd-add-btn { flex: 1; background: var(--ty-orange); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .pd-add-btn:hover { background: var(--ty-orange-dark); }
  .pd-fav-btn { width: 50px; border: 1.5px solid var(--ty-border); border-radius: 6px; background: white; font-size: 18px; cursor: pointer; }

  .pd-stock-note { font-size: 12px; color: var(--ty-green); font-weight: 700; }

  .pd-desc { margin-top: 8px; font-size: 13.5px; color: var(--ty-dark); line-height: 1.7; }
  .pd-desc h3 { font-size: 14px; margin-bottom: 6px; }

  .pd-other-section { margin-top: 40px; }
  .pd-other-section h2 { font-size: 17px; font-weight: 800; margin-bottom: 14px; }

  .pd-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ty-dark); color: white; padding: 12px 22px; border-radius: 8px;
    font-size: 13px; font-weight: 600; z-index: 300; opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  .pd-toast.show { opacity: 1; }

  @media (max-width: 800px) {
    .pd-wrap { padding: 16px; }
    .pd-main { grid-template-columns: 1fr; padding: 20px; gap: 20px; }
    .pd-image-main { font-size: 90px; }
  }
  @media (max-width: 480px) {
    .pd-wrap { padding: 12px; }
    .pd-main { padding: 14px; border-radius: 8px; }
    .pd-title { font-size: 17px; }
    .pd-price-new { font-size: 24px; }
    .pd-thumb { width: 52px; height: 52px; font-size: 22px; }
    .pd-actions { flex-wrap: wrap; }
    .pd-add-btn { min-width: 100%; order: -1; }
  }
</style>
</head>
<body>

  <div class="utility-bar">
    <span><a href="partner-login.html" style="color:inherit;">İşletme Paneli</a></span>
    <span><a href="admin.html" style="color:inherit;">Platform Özeti</a></span>
    <span><a href="yardim.html" style="color:inherit;">Yardım & Destek</a></span>
  </div>

  <header class="ty-header">
    <a href="index.html" class="ty-logo" style="text-decoration:none;">
      <span class="leaf">🌿</span>
      <div>markabahçem<span class="sub">.com</span></div>
    </a>
    <div class="ty-search">
      <input type="text" id="searchInput" placeholder="Beymen tişört, Koton pantolon, telefon ara..." />
      <button id="searchBtn">🔍</button>
    </div>
    <div class="ty-header-actions">
      <a href="login.html" class="action-item" id="authAction"><span class="icon">👤</span>Giriş Yap</a>
      <a href="favorites.html" class="action-item">
        <span class="icon">♡<span class="ty-cart-count" id="favCount">0</span></span>Favorilerim
      </a>
      <a href="index.html" class="action-item" style="cursor:pointer;">
        <span class="icon">🛒<span class="ty-cart-count" id="cartCount">0</span></span>Sepetim
      </a>
    </div>
  </header>

  <nav class="ty-categories">
    <a href="index.html">Tüm Mağazalar</a>
    <a href="index.html?store=beymen">Beymen</a>
    <a href="index.html?store=koton">Koton</a>
    <a href="index.html?store=adilisik">Adil Işık</a>
    <a href="index.html?store=altinyildiz">Altınyıldız Classics</a>
  </nav>

  <div class="pd-wrap">
    <div class="pd-breadcrumb" id="breadcrumb">Ana Sayfa &rsaquo; Yükleniyor...</div>
    <div id="pdMain"></div>

    <div class="pd-other-section" id="otherSection" style="display:none;">
      <h2 id="otherTitle">Bu mağazadan diğer ürünler</h2>
      <div class="ty-product-grid" id="otherGrid"></div>
    </div>
  </div>

  <div class="pd-toast" id="toast">Sepete eklendi ✓</div>

  <script src="static-api.js"></script>
  <script src="siteBranding.js"></script>
  <script src="mockMeta.js"></script>
  <script src="cartStore.js"></script>
  <script src="favoritesStore.js"></script>
  <script src="auth.js"></script>
  <script src="headerSearch.js"></script>
  <script src="product.js"></script>
</body>
</html>

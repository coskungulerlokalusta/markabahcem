<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Giriş Yap / Kayıt Ol — markabahçem.com</title>
<link rel="stylesheet" href="trendyol-style.css" />
<style>
  body { background: var(--ty-bg); }
  .auth-wrap { max-width: 420px; margin: 60px auto; padding: 0 20px; }
  @media (max-width: 480px) {
    .auth-wrap { margin: 32px auto; }
    .auth-panel { padding: 20px; }
  }
  .auth-logo { text-align: center; margin-bottom: 24px; }
  .auth-logo .leaf { font-size: 32px; }
  .auth-logo .name { font-weight: 800; font-size: 22px; color: var(--ty-orange); }

  .auth-tabs { display: flex; background: white; border-radius: 8px 8px 0 0; overflow: hidden; border: 1px solid var(--ty-border); border-bottom: none; }
  .auth-tab { flex: 1; text-align: center; padding: 14px; font-weight: 700; font-size: 13px; color: var(--ty-gray); cursor: pointer; }
  .auth-tab.active { color: var(--ty-orange); border-bottom: 3px solid var(--ty-orange); }

  .auth-panel { background: white; border: 1px solid var(--ty-border); border-radius: 0 0 10px 10px; padding: 28px; }
  .auth-panel.hidden { display: none; }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-size: 12px; font-weight: 700; color: var(--ty-gray); margin-bottom: 6px; }
  .auth-field input {
    width: 100%; padding: 12px; border: 1.5px solid var(--ty-border); border-radius: 6px; font-size: 14px; box-sizing: border-box;
  }
  .auth-field input:focus { outline: none; border-color: var(--ty-orange); }

  .auth-submit {
    width: 100%; background: var(--ty-orange); color: white; border: none; padding: 14px;
    border-radius: 6px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 6px;
  }
  .auth-submit:hover { background: var(--ty-orange-dark); }
  .auth-note { font-size: 11px; color: var(--ty-gray); margin-top: 14px; text-align: center; line-height: 1.5; }
  .auth-back { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--ty-gray); }
</style>
</head>
<body>

  <div class="auth-wrap">
    <a href="index.html" style="text-decoration:none;">
      <div class="auth-logo">
        <div class="leaf">🌿</div>
        <div class="name">markabahçem.com</div>
      </div>
    </a>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</div>
      <div class="auth-tab" id="tabRegister" onclick="switchTab('register')">Kayıt Ol</div>
    </div>

    <div class="auth-panel" id="panelLogin">
      <div class="auth-field">
        <label>E-posta</label>
        <input type="email" id="loginEmail" placeholder="ornek@eposta.com" value="ahmet@example.com" />
      </div>
      <div class="auth-field">
        <label>Şifre</label>
        <input type="password" id="loginPassword" placeholder="••••••••" value="demo1234" />
      </div>
      <button class="auth-submit" onclick="doLogin()">Giriş Yap</button>
      <div class="auth-note">🔒 Bu bir prototiptir; şifreniz gerçekten doğrulanmaz, herhangi bir e-posta ile giriş yapabilirsiniz.</div>
    </div>

    <div class="auth-panel hidden" id="panelRegister">
      <div class="auth-field">
        <label>Ad Soyad</label>
        <input type="text" id="regName" placeholder="Ahmet Yılmaz" />
      </div>
      <div class="auth-field">
        <label>E-posta</label>
        <input type="email" id="regEmail" placeholder="ornek@eposta.com" />
      </div>
      <div class="auth-field">
        <label>Şifre</label>
        <input type="password" id="regPassword" placeholder="••••••••" />
      </div>
      <button class="auth-submit" onclick="doRegister()">Hesap Oluştur</button>
      <div class="auth-note">🔒 Bu bir prototiptir; kayıt bilgileri yalnızca tarayıcınızda saklanır.</div>
    </div>

    <a href="index.html" class="auth-back">&larr; Alışverişe devam et</a>
  </div>

  <script src="static-api.js"></script>
  <script src="auth.js"></script>
  <script src="loginPage.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kategori — markabahçem.com</title>
<link rel="stylesheet" href="trendyol-style.css" />
<style>
  .cat-wrap { max-width: 1200px; margin: 0 auto; padding: 20px 32px 60px; }
  .cat-breadcrumb { font-size: 12px; color: var(--ty-gray); margin-bottom: 8px; }
  .cat-breadcrumb a { color: var(--ty-gray); }
  .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .cat-header .icon { font-size: 26px; }
  .cat-header h1 { font-size: 22px; margin: 0; }
  .cat-count { font-size: 13px; color: var(--ty-gray); margin-bottom: 20px; }

  .cat-layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  .cat-sidebar { background: white; border: 1px solid var(--ty-border); border-radius: 10px; padding: 16px; position: sticky; top: 20px; }
  .cat-sidebar h3 { font-size: 12px; text-transform: uppercase; color: var(--ty-gray); margin: 0 0 10px; }
  .cat-sidebar a { display: block; font-size: 13px; padding: 7px 0; color: var(--ty-dark); border-bottom: 1px solid #f5f5f5; }
  .cat-sidebar a.active { color: var(--ty-orange); font-weight: 700; }

  .cat-empty { background: white; border: 1px solid var(--ty-border); border-radius: 10px; padding: 40px; text-align: center; }
  .cat-empty .emoji { font-size: 40px; margin-bottom: 10px; }
  .cat-empty p { color: var(--ty-gray); font-size: 13px; margin-bottom: 18px; }
  .cat-empty a { color: var(--ty-orange); font-weight: 700; font-size: 13px; }

  @media (max-width: 800px) {
    .cat-wrap { padding: 16px 16px 40px; }
    .cat-layout { grid-template-columns: 1fr; gap: 16px; }
    .cat-sidebar { position: static; }
  }
</style>
</head>
<body>

  <div class="utility-bar">
    <span><a href="partner-login.html" style="color:inherit;">İşletme Paneli</a></span>
    <span><a href="admin.html" style="color:inherit;">Platform Özeti</a></span>
    <span><a href="yardim.html" style="color:inherit;">Yardım & Destek</a></span>
  </div>

  <header class="ty-header">
    <a href="index.html" class="ty-logo" style="text-decoration:none;">
      <span class="leaf">🌿</span><div>markabahçem<span class="sub">.com</span></div>
    </a>
    <div class="ty-search"><input type="text" id="searchInput" placeholder="Ürün, kategori veya marka ara" /><button id="searchBtn">🔍</button></div>
    <div class="ty-header-actions">
      <a href="index.html" class="action-item" style="cursor:pointer;">
        <span class="icon">🛒<span class="ty-cart-count" id="cartCount">0</span></span>Sepetim
      </a>
    </div>
  </header>

  <nav class="ty-categories">
    <a href="category.html?cat=kadin">Kadın</a>
    <a href="category.html?cat=erkek">Erkek</a>
    <a href="category.html?cat=anne-cocuk">Anne & Çocuk</a>
    <a href="category.html?cat=ev-yasam">Ev & Yaşam</a>
    <a href="category.html?cat=supermarket">Süpermarket</a>
    <a href="category.html?cat=kozmetik">Kozmetik</a>
    <a href="category.html?cat=ayakkabi-canta">Ayakkabı & Çanta</a>
    <a href="category.html?cat=elektronik">Elektronik</a>
    <a href="category.html?cat=saat-aksesuar">Saat & Aksesuar</a>
    <a href="category.html?cat=spor-outdoor">Spor & Outdoor</a>
  </nav>

  <div class="cat-wrap">
    <div class="cat-breadcrumb" id="breadcrumb">Ana Sayfa &rsaquo; ...</div>
    <div class="cat-header"><span class="icon" id="catIcon"></span><h1 id="catTitle">Yükleniyor...</h1></div>
    <div class="cat-count" id="catCount"></div>

    <div class="cat-layout">
      <aside class="cat-sidebar">
        <h3>Alt Kategoriler</h3>
        <div id="subcategoryList"></div>
      </aside>
      <div>
        <div id="productGrid" class="ty-product-grid"></div>
        <div id="emptyState" class="cat-empty" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="static-api.js"></script>
  <script src="siteBranding.js"></script>
  <script src="mockMeta.js"></script>
  <script src="cartStore.js"></script>
  <script src="headerSearch.js"></script>
  <script src="category.js"></script>
</body>
</html>

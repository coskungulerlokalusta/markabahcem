<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kargo Takip — markabahçem.com</title>
<link rel="stylesheet" href="trendyol-style.css" />
<style>
  .info-wrap { max-width: 600px; margin: 0 auto; padding: 40px 32px 60px; }
  .info-wrap h1 { font-size: 26px; margin-bottom: 6px; }
  .info-wrap .lead { color: var(--ty-gray); font-size: 14px; margin-bottom: 24px; }
  .track-box { background: white; border: 1px solid var(--ty-border); border-radius: 12px; padding: 24px; }
  .track-box input { width: 100%; padding: 12px; border: 1.5px solid var(--ty-border); border-radius: 6px; font-size: 14px; margin-bottom: 12px; box-sizing: border-box; }
  .track-box button { width: 100%; background: var(--ty-orange); color: white; border: none; padding: 13px; border-radius: 6px; font-weight: 800; font-size: 14px; cursor: pointer; }
  .track-result { margin-top: 20px; padding: 16px; background: var(--ty-orange-light); border-radius: 8px; font-size: 13px; color: var(--ty-orange-dark); display: none; }
  .track-note { font-size: 12px; color: var(--ty-gray); margin-top: 16px; line-height: 1.6; }

  @media (max-width: 600px) {
    .info-wrap { padding: 24px 16px 40px; }
    .info-wrap h1 { font-size: 21px; }
    .track-box { padding: 16px; }
  }
</style>
</head>
<body>
  <script src="static-api.js"></script>
  <script src="siteBranding.js"></script>

  <header class="ty-header">
    <a href="index.html" class="ty-logo" style="text-decoration:none;">
      <span class="leaf">🌿</span><div>markabahçem<span class="sub">.com</span></div>
    </a>
    <div style="flex:1;"></div>
    <div class="ty-header-actions">
      <a href="index.html" class="action-item" style="cursor:pointer;">Ana Sayfaya Dön</a>
    </div>
  </header>

  <div class="info-wrap">
    <h1>Kargo Takip</h1>
    <p class="lead">Sipariş numaranı gir, kargo durumunu görelim.</p>

    <div class="track-box">
      <input type="text" id="orderInput" placeholder="Sipariş No (örn: MB-2026-1001)" />
      <button onclick="trackOrder()">Sorgula</button>
      <div class="track-result" id="trackResult"></div>
    </div>

    <p class="track-note">Not: Siparişinizde birden fazla mağaza varsa, her mağaza için ayrı kargo takip numarası oluşur — burada tüm alt siparişlerinizin durumunu birlikte görürsünüz.</p>
  </div>

  <script>
    async function trackOrder() {
      const orderNumber = document.getElementById('orderInput').value.trim();
      const resultBox = document.getElementById('trackResult');
      if (!orderNumber) return;

      try {
        const res = await fetch(`/api/orders/${orderNumber}`);
        if (!res.ok) {
          resultBox.style.display = 'block';
          resultBox.innerHTML = 'Bu sipariş numarasıyla bir kayıt bulunamadı.';
          return;
        }
        const data = await res.json();
        resultBox.style.display = 'block';
        resultBox.innerHTML = `
          <strong>Sipariş: ${data.order.orderNumber}</strong><br/><br/>
          ${data.subOrders.map(so => `${so.storeName}: <strong>${so.status}</strong>`).join('<br/>')}
        `;
      } catch (e) {
        resultBox.style.display = 'block';
        resultBox.innerHTML = 'Sorgulama sırasında bir hata oluştu.';
      }
    }
  </script>
</body>
</html>
